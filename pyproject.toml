[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adresplan"
version = "1.2.0"
description = "Address Plan: local IPv4 VLSM and IPv6 planning tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomasz Dyrc" }]
dependencies = [
    "pydantic>=2.14,<3",
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.32,<1",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.2,<2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
dev = [
    "setuptools>=77",
    "pytest>=9.1,<10",
    "hypothesis>=6.169,<7",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "build>=1.6,<2",
    "wheel>=0.48,<1",
    "httpx2>=2.13,<3",
    "types-openpyxl>=3.1.5,<4",
]

[project.scripts]
adresplan = "adresplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adresplan = ["py.typed", "schemas/*.json", "locale/*.json", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tmp", "tmp", ".venv*", "build", "dist", "data", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/adresplan"]
warn_unreachable = true

